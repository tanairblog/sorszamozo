<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorbarendezés pontozó - Psychedelic Edition</title>

  <!-- Hippie / Pszichedelikus betűtípusok: Bungee Spice & Shrikhand -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee+Spice&family=Shrikhand&display=swap" rel="stylesheet">

  <style>
    :root {
      --neon-cyan: #00f0ff;
      --neon-pink: #ff007f;
      --neon-yellow: #ffea00;
      --neon-green: #00ff66;
      --neon-purple: #bd00ff;
      --panel-bg: rgba(14, 2, 29, 0.82);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 16px;
      min-height: 100vh;
      color: #fff;
      font-family: 'Shrikhand', cursive, sans-serif;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: center;
      align-items: flex-start;

      /* Pulzáló, örvénylő pszichedelikus háttér konikus és radiális gradiensekkel */
      background:
        radial-gradient(ellipse at 20% 50%, rgba(255, 0, 128, 0.65), transparent 45%),
        radial-gradient(ellipse at 80% 40%, rgba(0, 240, 255, 0.65), transparent 45%),
        radial-gradient(circle at 50% 80%, rgba(255, 234, 0, 0.55), transparent 40%),
        conic-gradient(from 180deg at 50% 50%, #ff0055, #ff9900, #ffee00, #00ff66, #00ccff, #7700ff, #ff00aa, #ff0055);
      background-size: 200% 200%;
      animation: psychedelicSwirl 18s ease-in-out infinite alternate;
    }

    @keyframes psychedelicSwirl {
      0% {
        background-position: 0% 0%;
        filter: hue-rotate(0deg) saturate(140%);
      }
      50% {
        background-position: 100% 100%;
        filter: hue-rotate(180deg) saturate(180%);
      }
      100% {
        background-position: 0% 100%;
        filter: hue-rotate(360deg) saturate(140%);
      }
    }

    .app-container {
      width: 100%;
      max-width: 920px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .main-title {
      font-family: 'Bungee Spice', cursive;
      font-size: clamp(2rem, 5vw, 3.4rem);
      text-align: center;
      margin: 0;
      line-height: 1.15;
      text-shadow:
        0 0 10px rgba(255, 255, 255, 0.8),
        0 0 20px var(--neon-pink),
        0 0 40px var(--neon-purple);
      filter: drop-shadow(4px 4px 0 #000);
    }

    .panel {
      background: var(--panel-bg);
      border-radius: 26px;
      padding: 22px 26px;
      border: 3px solid var(--neon-cyan);
      box-shadow:
        0 0 20px rgba(0, 240, 255, 0.4),
        inset 0 0 25px rgba(189, 0, 255, 0.35),
        8px 8px 0 rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
    }

    .config-row {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 1.25rem;
      color: var(--neon-yellow);
      text-shadow: 2px 2px 0 #000;
    }

    input[type="number"] {
      font-family: 'Shrikhand', cursive;
      width: 75px;
      height: 52px;
      background: #0f0522;
      border: 3px solid var(--neon-pink);
      border-radius: 14px;
      color: var(--neon-yellow);
      font-size: 1.5rem;
      text-align: center;
      outline: none;
      box-shadow: 0 0 12px var(--neon-pink);
    }

    button {
      font-family: 'Shrikhand', cursive;
      cursor: pointer;
      border: none;
      border-radius: 16px;
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
      text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.8);
    }

    button:hover {
      transform: scale(1.04) translateY(-2px);
    }

    button:active {
      transform: scale(0.97);
    }

    .btn-generate {
      background: linear-gradient(135deg, #00ff66, #ffea00);
      color: #100220;
      padding: 12px 26px;
      font-size: 1.15rem;
      box-shadow: 0 0 16px var(--neon-green);
    }

    .row-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 16px 0 10px 0;
    }

    .section-title {
      font-size: 1.3rem;
      color: var(--neon-cyan);
      text-shadow: 0 0 8px var(--neon-cyan), 2px 2px 0 #000;
    }

    .btn-clear {
      background: linear-gradient(135deg, #ff0055, #ff5500);
      color: #fff;
      padding: 6px 14px;
      font-size: 0.85rem;
      box-shadow: 0 0 10px rgba(255, 0, 85, 0.5);
    }

    .boxes-container {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 14px;
    }

    .box-input {
      font-family: 'Shrikhand', cursive;
      width: 60px;
      height: 60px;
      border-radius: 16px;
      background: #120324;
      border: 3px solid var(--neon-purple);
      color: #fff;
      font-size: 1.6rem;
      text-align: center;
      outline: none;
      box-shadow:
        0 0 10px rgba(189, 0, 255, 0.4),
        inset 0 0 8px rgba(0, 0, 0, 0.7);
      transition: all 0.15s ease-in-out;
    }

    .box-input:focus {
      border-color: var(--neon-yellow);
      box-shadow: 0 0 18px var(--neon-yellow);
      transform: scale(1.06);
    }

    .box-input.correct {
      background: #022a16;
      border-color: var(--neon-green) !important;
      color: #adff2f !important;
      box-shadow:
        0 0 20px var(--neon-green),
        inset 0 0 10px var(--neon-green) !important;
      animation: groovyPop 0.4s ease-out;
    }

    .box-input.incorrect {
      background: #340012;
      border-color: #ff0037 !important;
      color: #ff99aa !important;
      box-shadow:
        0 0 18px #ff0037,
        inset 0 0 8px #ff0037 !important;
    }

    @keyframes groovyPop {
      0% { transform: scale(0.8); }
      50% { transform: scale(1.18) rotate(-4deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    .btn-score {
      width: 100%;
      margin-top: 14px;
      padding: 16px;
      background: linear-gradient(90deg, #ff007f, #bd00ff, #00f0ff);
      background-size: 200% 200%;
      animation: buttonRainbow 5s linear infinite;
      color: #fff;
      font-size: 1.7rem;
      box-shadow: 0 0 24px rgba(255, 0, 127, 0.7);
    }

    @keyframes buttonRainbow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .result-panel {
      margin-top: 20px;
      text-align: center;
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      color: var(--neon-green);
      text-shadow:
        0 0 12px var(--neon-green),
        0 0 30px rgba(0, 255, 102, 0.8),
        3px 3px 0 #000;
      min-height: 3rem;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <h1 class="main-title">Sorbarendezés pontozó</h1>

    <div class="panel">
      <div class="config-row">
        <label for="item-count">Elemek száma:</label>
        <input type="number" id="item-count" min="2" max="25" value="7">
        <button id="generate-btn" class="btn-generate" type="button">Mezők generálása</button>
      </div>
    </div>

    <div id="board" class="panel" style="display: none;">
      <!-- Helyes sorrend -->
      <div class="row-header">
        <span class="section-title">Helyes sorrend (kulcs):</span>
        <button id="clear-correct-btn" class="btn-clear" type="button">Kulcs törlése</button>
      </div>
      <div id="correct-inputs" class="boxes-container"></div>

      <!-- Diák megoldása -->
      <div class="row-header">
        <span class="section-title">Diák megoldása:</span>
        <button id="clear-student-btn" class="btn-clear" type="button">Diák válasz törlése</button>
      </div>
      <div id="student-inputs" class="boxes-container"></div>

      <button id="evaluate-btn" class="btn-score" type="button">Pontozás</button>
      <div id="result-output" class="result-panel"></div>
    </div>
  </div>

  <script>
    const countInput = document.getElementById('item-count');
    const generateBtn = document.getElementById('generate-btn');
    const board = document.getElementById('board');
    const correctContainer = document.getElementById('correct-inputs');
    const studentContainer = document.getElementById('student-inputs');
    const evaluateBtn = document.getElementById('evaluate-btn');
    const clearCorrectBtn = document.getElementById('clear-correct-btn');
    const clearStudentBtn = document.getElementById('clear-student-btn');
    const resultOutput = document.getElementById('result-output');

    function resetEvaluationStyles() {
      studentContainer.querySelectorAll('.box-input').forEach(box => {
        box.classList.remove('correct', 'incorrect');
      });
      resultOutput.textContent = '';
    }

    function createBoxes() {
      const n = parseInt(countInput.value, 10);
      if (isNaN(n) || n < 2) {
        alert('Kérlek adj meg legalább 2 elemet.');
        return;
      }

      correctContainer.innerHTML = '';
      studentContainer.innerHTML = '';
      resetEvaluationStyles();

      for (let i = 0; i < n; i++) {
        // Helyes sorrend mezők (alapértelmezetten 1..N)
        const cBox = document.createElement('input');
        cBox.type = 'text';
        cBox.className = 'box-input';
        cBox.value = i + 1;
        correctContainer.appendChild(cBox);

        // Diák mezők
        const sBox = document.createElement('input');
        sBox.type = 'text';
        sBox.className = 'box-input';
        studentContainer.appendChild(sBox);
      }

      board.style.display = 'block';
    }

    function evaluateSubmission() {
      const correctBoxes = Array.from(correctContainer.querySelectorAll('.box-input'));
      const studentBoxes = Array.from(studentContainer.querySelectorAll('.box-input'));

      const correctList = correctBoxes.map(b => b.value.trim());
      const studentList = studentBoxes.map(b => b.value.trim());

      const n = correctList.length;
      let score = 0;

      // Helyes szomszédossági tábla a kulcs szerint
      const expectedPrev = {};
      const expectedNext = {};

      for (let i = 0; i < n; i++) {
        const item = correctList[i];
        expectedPrev[item] = (i > 0) ? correctList[i - 1] : null;
        expectedNext[item] = (i < n - 1) ? correctList[i + 1] : null;
      }

      resetEvaluationStyles();

      for (let i = 0; i < n; i++) {
        const item = studentList[i];
        let isPointWorthy = false;

        if (item !== '' && Object.prototype.hasOwnProperty.call(expectedPrev, item)) {
          const currentPrev = (i > 0) ? studentList[i - 1] : null;
          const currentNext = (i < n - 1) ? studentList[i + 1] : null;

          if (i === 0) {
            // Első elem: a rákövetkező elemnek kell helyesnek lennie
            if (currentNext === expectedNext[item]) {
              isPointWorthy = true;
            }
          } else if (i === n - 1) {
            // Utolsó elem: a megelőző elemnek kell helyesnek lennie
            if (currentPrev === expectedPrev[item]) {
              isPointWorthy = true;
            }
          } else {
            // Belső elem: mindkét szomszédnak egyeznie kell a helyessel
            if (currentPrev === expectedPrev[item] && currentNext === expectedNext[item]) {
              isPointWorthy = true;
            }
          }
        }

        if (isPointWorthy) {
          studentBoxes[i].classList.add('correct');
          score++;
        } else {
          studentBoxes[i].classList.add('incorrect');
        }
      }

      resultOutput.textContent = `Elért pontszám: ${score} / ${n}`;
    }

    generateBtn.addEventListener('click', createBoxes);
    evaluateBtn.addEventListener('click', evaluateSubmission);

    clearCorrectBtn.addEventListener('click', () => {
      correctContainer.querySelectorAll('.box-input').forEach(box => {
        box.value = '';
      });
      resetEvaluationStyles();
    });

    clearStudentBtn.addEventListener('click', () => {
      const inputs = studentContainer.querySelectorAll('.box-input');
      inputs.forEach(box => {
        box.value = '';
      });
      resetEvaluationStyles();
      if (inputs.length > 0) {
        inputs[0].focus();
      }
    });

    createBoxes();
  </script>
</body>
</html>
